# Benchmark configuration. Supply credentials through environment variables;
# never commit secrets here. API mutations are gated by a healthy API and cloud
# identity checks performed by the suite before any test begins.
control_plane:
  base_url: "${CONTROL_PLANE_URL:-http://127.0.0.1:8081}"
  admin_token: "${ADMIN_TOKEN}"
  request_timeout_seconds: 180

network:
  domain: "${ROUTING_DOMAIN:-cstam.felcloud.tn}"
  public_vip: "${PUBLIC_VIP_IP:-}"
  pool_cidr: "${IP_POOL_CIDR:-}"
  quarantine_seconds: "${IP_QUARANTINE_SECONDS:-}"

gateways:
  primary_name: "${BENCH_PRIMARY_GATEWAY:-gw1}"
  standby_name: "${BENCH_STANDBY_GATEWAY:-gw2}"
  bastion_ip: "${BASTION_IP:-}"
  ssh_key_path: "${SSH_KEY_PATH:-}"

openstack:
  cloud: "${OS_CLOUD:-felcloud}"

benchmark:
  seed: 42
  resource_prefix: "bench-"
  t1_runs: 30
  t1_cold_runs: 10
  t2_concurrency_levels: [10, 20, 30, 50]
  t2_repetitions_per_level: 5
  t3_repetitions_per_mode: 20
  t3_manual_failover_runs: 10
  t4_recycle_cycles: 100
  t4_rapid_cycles: 20
  t5_lease_samples: 20
  t6_valid_runs: 30
  t6_invalid_runs: 30
  t7_sandboxes: 3
